name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - run: go vet ./...
      - name: Build release archives
        run: |
          set -eu
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/mysql-benchmark" ./cmd/mysql-benchmark
              tar -czf "dist/mysql-benchmark-${os}-${arch}.tar.gz" -C dist mysql-benchmark
              rm "dist/mysql-benchmark"
            done
          done
          sha256sum dist/*.tar.gz > dist/checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
