name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: GOOS=linux GOARCH=amd64 go build -o /tmp/mysql-benchmark-linux-amd64 ./cmd/mysql-benchmark
      - run: GOOS=linux GOARCH=arm64 go build -o /tmp/mysql-benchmark-linux-arm64 ./cmd/mysql-benchmark
